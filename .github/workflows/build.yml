name: Build PS3 Package (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ps3:
    name: Compile Homebrew PKG
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev-sdl2:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Environment & Locate PSL1GHT
        run: |
          echo "=== CONTAINER ENVIRONMENT ==="
          env
          echo "=== LOCATING Makefile.base ==="
          find / -name "Makefile.base" 2>/dev/null || true
          
          # Find directory containing Makefile.base
          BASE_DIR=$(dirname $(find / -name "Makefile.base" 2>/dev/null | head -n 1))
          echo "Found PSL1GHT base dir: $BASE_DIR"
          if [ -n "$BASE_DIR" ]; then
            echo "PSL1GHT=$BASE_DIR" >> $GITHUB_ENV
          fi

      - name: Compile SELF & EBOOT.BIN
        run: |
          echo "Using PSL1GHT=$PSL1GHT"
          make clean || true
          make

      - name: Build Installable PS3 PKG
        run: |
          make pkg || true
          ls -la

      - name: Upload PS3 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thats-not-my-neighbor-ps3-build
          path: |
            *.pkg
            *.self
            *.elf
          if-no-files-found: warn
